<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meu Carrinho - RELIVRO</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <a href="../index.html" class="logo-container">
                <img src="../assets/images/logo.jpeg" alt="Logo Relivro" class="header-logo">
                <span class="logo">RELIVRO</span>
            </a>

            <nav class="nav-links">
                <a href="favorites.html"><i class="fa fa-heart"></i> Meus Favoritos</a>
                <a href="cart.html"><i class="fa fa-shopping-cart"></i> Meu Carrinho</a>
            </nav>
        </div>
    </header>

    <main class="cart-main-container">
        <h1 class="page-title">Meu Carrinho</h1>
        <div class="books-grid" id="cart-container"></div>
    </main>

    <section class="checkout-section">
        <div class="total-box">
            <span>Total da Compra</span>
            <strong id="total-price">R$ 0,00</strong>
        </div>
        <button class="btn-checkout" id="checkout-button">
            Finalizar Compra
        </button>
    </section>

    <script src="../assets/js/main.js"></script>
</body>
</html>
